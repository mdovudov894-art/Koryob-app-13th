<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Корбор — Маркетплейси Хизматрасонӣ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

    .hero{
      min-height:100vh;
      background: linear-gradient(145deg,#0F0C29,#302B63,#24243E);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:40px 24px;
      position:relative;overflow:hidden;
    }

    /* Орқа фони анимацияшуда */
    .blob{
      position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;
      animation:float 8s ease-in-out infinite;
    }
    .blob1{width:300px;height:300px;background:#6C63FF;top:-50px;right:-80px;animation-delay:0s}
    .blob2{width:250px;height:250px;background:#FF6584;bottom:-60px;left:-60px;animation-delay:3s}
    .blob3{width:200px;height:200px;background:#43E97B;top:50%;left:50%;animation-delay:5s}

    @keyframes float{
      0%,100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-30px) scale(1.05)}
    }

    .content{position:relative;z-index:2;text-align:center;width:100%;max-width:420px}

    .logo-wrap{
      width:90px;height:90px;
      background:linear-gradient(135deg,#6C63FF,#FF6584);
      border-radius:28px;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 28px;
      box-shadow:0 20px 60px rgba(108,99,255,0.5);
      animation:logoIn 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    @keyframes logoIn{
      from{opacity:0;transform:scale(0.5) rotate(-10deg)}
      to{opacity:1;transform:scale(1) rotate(0)}
    }

    .logo-wrap span{font-size:42px;font-weight:900;color:white}

    .hero-title{
      font-size:38px;font-weight:900;color:white;
      line-height:1.1;margin-bottom:14px;
      animation:slideUp 0.6s ease 0.2s both;
    }

    .hero-title span{
      background:linear-gradient(135deg,#6C63FF,#FF6584);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .hero-sub{
      font-size:16px;color:rgba(255,255,255,0.65);
      margin-bottom:40px;line-height:1.6;
      animation:slideUp 0.6s ease 0.3s both;
    }

    @keyframes slideUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* Статистика */
    .stats{
      display:flex;gap:8px;justify-content:center;
      margin-bottom:40px;
      animation:slideUp 0.6s ease 0.4s both;
    }

    .stat-item{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;padding:14px 20px;text-align:center;flex:1;
    }

    .stat-num{font-size:22px;font-weight:800;color:white}
    .stat-label{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;font-weight:500}

    /* Хусусиятҳо */
    .features{
      display:flex;gap:10px;justify-content:center;
      margin-bottom:40px;
      animation:slideUp 0.6s ease 0.5s both;
    }

    .feature{
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:16px;padding:16px 12px;
      display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;
    }

    .feature-icon{
      width:44px;height:44px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;font-size:20px;
    }

    .fi1{background:linear-gradient(135deg,#6C63FF,#A78BFA)}
    .fi2{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
    .fi3{background:linear-gradient(135deg,#10B981,#34D399)}

    .feature span{font-size:12px;color:rgba(255,255,255,0.7);font-weight:600}

    /* Тугмачаҳо */
    .buttons{
      width:100%;display:flex;flex-direction:column;gap:12px;
      animation:slideUp 0.6s ease 0.6s both;
    }

    .btn-main{
      padding:17px;border-radius:16px;font-size:16px;font-weight:700;
      cursor:pointer;border:none;transition:all 0.3s ease;text-decoration:none;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }

    .btn-login{
      background:linear-gradient(135deg,#6C63FF,#8B5CF6);
      color:white;box-shadow:0 8px 32px rgba(108,99,255,0.45);
    }

    .btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,0.55)}

    .btn-register{
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      color:white;border:1px solid rgba(255,255,255,0.2);
    }

    .btn-register:hover{background:rgba(255,255,255,0.18);transform:translateY(-1px)}

    .bottom-text{
      margin-top:24px;font-size:13px;
      color:rgba(255,255,255,0.35);
      animation:slideUp 0.6s ease 0.7s both;
    }
  </style>
</head>
<body>
<div class="hero">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="content">
    <div class="logo-wrap"><span>К</span></div>

    <h1 class="hero-title">Корбор <br/><span>Тоҷикистон</span></h1>
    <p class="hero-sub">Беҳтарин устоҳои Тоҷикистонро дар як лаҳза пайдо кунед</p>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-num">500+</div>
        <div class="stat-label">Устоҳо</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">14</div>
        <div class="stat-label">Шаҳр</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">4.9★</div>
        <div class="stat-label">Рейтинг</div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon fi1">🔨</div>
        <span>Устоҳо</span>
      </div>
      <div class="feature">
        <div class="feature-icon fi2">⭐</div>
        <span>Рейтинг</span>
      </div>
      <div class="feature">
        <div class="feature-icon fi3">💬</div>
        <span>Чат</span>
      </div>
    </div>

    <div class="buttons">
      <a href="/pages/login.html" class="btn-main btn-login">
        Дохил шудан →
      </a>
      <a href="/pages/register.html" class="btn-main btn-register">
        Акаунти нав сохтан
      </a>
    </div>

    <p class="bottom-text">Ройгон · Бехатар · Кафолатнок</p>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user')||'null');
  if(user){
    window.location.href = user.role==='worker'
      ?'/pages/worker-dashboard.html'
      :'/pages/customer-dashboard.html';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профилам — Корбор</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .profile-hero {
      background: linear-gradient(135deg, #064E3B, #059669);
      padding: 32px 20px 24px;
      color: white;
      text-align: center;
    }

    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: white;
      margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.4);
      overflow: hidden;
      cursor: pointer;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .profile-region {
      font-size: 14px;
      opacity: 0.85;
    }

    .section-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .section-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .cat-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      font-weight: 500;
    }

    .cat-checkbox.checked {
      border-color: var(--primary);
      background: #EFF6FF;
      color: var(--primary);
    }

    .cat-checkbox input {
      display: none;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .price-row input {
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .price-row input:focus {
      border-color: var(--primary);
    }

    .del-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #FEE2E2;
      color: var(--danger);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn {
      background: #EFF6FF;
      color: var(--primary);
      border: 2px dashed var(--primary);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: var(--transition);
    }

    .add-btn:hover {
      background: #DBEAFE;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .portfolio-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .upload-area:hover {
      border-color: var(--primary);
      background: #EFF6FF;
    }

    .upload-area p {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <a href="/pages/worker-dashboard.html"
    style="text-decoration:none;color:var(--text);">←</a>
  <h1>Профилам</h1>
</div>

<!-- МАЗМУН -->
<div id="content">
  <div class="loading" style="margin-top:60px;">
    <div class="spinner"></div>
  </div>
</div>

<!-- НАВБАРИ ПОЁН -->
<nav class="bottom-nav">
  <a href="/pages/worker-dashboard.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    Асосӣ
  </a>
  <a href="/pages/available-orders.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
    </svg>
    Эълонҳо
  </a>
  <a href="/pages/worker-profile.html" class="active">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    Профил
  </a>
  <a href="/pages/chats.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    Чатҳо
  </a>
</nav>

<script src="/js/api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/';
  const user = getUser();
  if (user.role !== 'worker') window.location.href = '/pages/customer-dashboard.html';

  const CATEGORIES = [
    'Кафел', 'Шкатур', 'Сантехника', 'Барқ',
    'Гаҷкорӣ', 'Рангкорӣ', 'Дарпеча', 'Фаршкорӣ',
    'Болопӯш', 'Стяжка', 'Дигар'
  ];

  let profile = null;
  let priceList = [];

  const loadProfile = async () => {
    try {
      profile = await API.getWorkerProfile();
      priceList = profile.priceList || [];
      renderProfile();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const renderProfile = () => {
    const html = `
      <!-- ГЕРОЙ -->
      <div class="profile-hero">
        <div class="profile-avatar">
          ${profile.user.avatar
            ? `<img src="${profile.user.avatar}" />`
            : profile.user.name.charAt(0)}
        </div>
        <div class="profile-name">${profile.user.name}</div>
        <div class="profile-region">📍 ${profile.user.region}</div>
      </div>

      <div style="padding:20px 16px 120px;">

        <!-- БИО -->
        <div class="section-card">
          <h3>👤 Дар бораи худ</h3>
          <div class="form-group" style="margin:0;">
            <textarea id="bioInput" placeholder="Таҷрибаи кор, малакаҳо..."
              style="min-height:80px;">${profile.bio || ''}</textarea>
          </div>
        </div>

        <!-- КАТЕГОРИЯҲО -->
        <div class="section-card">
          <h3>🔨 Хизматрасониҳо</h3>
          <div class="categories-grid">
            ${CATEGORIES.map(cat => {
              const checked = profile.categories.includes(cat);
              return `
                <div class="cat-checkbox ${checked ? 'checked' : ''}"
                  onclick="toggleCat(this, '${cat}')">
                  <input type="checkbox" ${checked ? 'checked' : ''} />
                  ${cat}
                </div>`;
            }).join('')}
          </div>
        </div>

        <!-- ПРАЙС-ЛИСТ -->
        <div class="section-card">
          <h3>💰 Нархҳо</h3>
          <div id="priceListContainer">
            ${renderPriceRows()}
          </div>
          <button class="add-btn" onclick="addPriceRow()">
            + Нарх илова кардан
          </button>
        </div>

        <!-- ПОРТФОЛИО -->
        <div class="section-card">
          <h3>🖼️ Портфолио</h3>
          ${profile.portfolio && profile.portfolio.length > 0 ? `
            <div class="portfolio-grid">
              ${profile.portfolio.map(img =>
                `<img src="${img}" onclick="window.open('${img}')" />`
              ).join('')}
            </div>` : ''}
          <div class="upload-area"
            onclick="document.getElementById('portfolioInput').click()">
            <div style="font-size:28px;">📸</div>
            <p>Суратҳои кори тайёрро илова кунед</p>
          </div>
          <input type="file" id="portfolioInput" accept="image/*"
            style="display:none" onchange="uploadPortfolio(this)" />
        </div>

        <!-- ЗАХИРА -->
        <button class="btn btn-primary" onclick="saveProfile()" id="saveBtn">
          💾 Захира кардан
        </button>

      </div>`;

    document.getElementById('content').innerHTML = html;
  };

  const renderPriceRows = () => {
    return priceList.map((p, i) => `
      <div class="price-row" id="priceRow${i}">
        <input type="text" placeholder="Хизмат" value="${p.service}"
          onchange="updatePrice(${i}, 'service', this.value)" />
        <input type="text" placeholder="Нарх" value="${p.price}"
          onchange="updatePrice(${i}, 'price', this.value)" />
        <button class="del-btn" onclick="removePrice(${i})">×</button>
      </div>
    `).join('');
  };

  const toggleCat = (el, cat) => {
    el.classList.toggle('checked');
  };

  const addPriceRow = () => {
    priceList.push({ service: '', price: '' });
    document.getElementById('priceListContainer').innerHTML = renderPriceRows();
  };

  const updatePrice = (i, field, val) => {
    priceList[i][field] = val;
  };

  const removePrice = (i) => {
    priceList.splice(i, 1);
    document.getElementById('priceListContainer').innerHTML = renderPriceRows();
  };

  const uploadPortfolio = async (input) => {
    if (!input.files[0]) return;
    try {
      showToast('Сурат бор карда мешавад...', '');
      const formData = new FormData();
      formData.append('image', input.files[0]);
      await API.addPortfolio(formData);
      showToast('✅ Сурат илова шуд!', 'success');
      loadProfile();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const saveProfile = async () => {
    const btn = document.getElementById('saveBtn');
    const bio = document.getElementById('bioInput').value.trim();
    const categories = Array.from(
      document.querySelectorAll('.cat-checkbox.checked')
    ).map(el => el.textContent.trim());

    btn.textContent = 'Интизор шавед...';
    btn.disabled = true;

    try {
      await API.updateWorkerProfile({ bio, categories, priceList });
      showToast('✅ Профил захира шуд!', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.textContent = '💾 Захира кардан';
      btn.disabled = false;
    }
  };

  loadProfile();
</script>

</body>
</html>

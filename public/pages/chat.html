<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат — Корбор</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#F5F5FF}

    .chat-header{
      background:linear-gradient(145deg,#0F0C29,#302B63);
      padding:16px 20px;
      display:flex;align-items:center;gap:14px;
      flex-shrink:0;position:relative;overflow:hidden;
    }

    .chat-header::before{
      content:'';position:absolute;
      width:150px;height:150px;
      background:rgba(108,99,255,0.2);
      border-radius:50%;filter:blur(40px);
      top:-50px;right:-30px;
    }

    .back-btn{
      color:rgba(255,255,255,0.8);text-decoration:none;
      font-size:20px;z-index:2;transition:color 0.2s;
    }
    .back-btn:hover{color:white}

    .header-avatar{
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg,#6C63FF,#8B5CF6);
      display:flex;align-items:center;justify-content:center;
      color:white;font-weight:800;font-size:18px;
      z-index:2;flex-shrink:0;overflow:hidden;
    }

    .header-avatar img{width:100%;height:100%;object-fit:cover}

    .header-info{z-index:2}
    .header-info h3{font-size:16px;font-weight:800;color:white}
    .header-info p{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px}

    .online-dot{
      width:8px;height:8px;border-radius:50%;
      background:#34D399;margin-left:auto;z-index:2;
      box-shadow:0 0 8px rgba(52,211,153,0.8);
      animation:pulse 2s infinite;
    }

    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    /* MESSAGES */
    .messages-area{
      flex:1;overflow-y:auto;
      padding:16px;display:flex;
      flex-direction:column;gap:10px;
      background:#F5F5FF;
    }

    .messages-area::-webkit-scrollbar{width:3px}
    .messages-area::-webkit-scrollbar-thumb{background:#6C63FF;border-radius:4px}

    .date-chip{
      align-self:center;
      background:rgba(108,99,255,0.1);
      color:#6C63FF;padding:5px 14px;
      border-radius:20px;font-size:11px;font-weight:700;
    }

    .message{
      display:flex;flex-direction:column;
      max-width:78%;animation:msgIn 0.3s ease both;
    }

    @keyframes msgIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    .message.mine{align-self:flex-end;align-items:flex-end}
    .message.other{align-self:flex-start;align-items:flex-start}

    .msg-sender{
      font-size:11px;font-weight:700;
      color:#9CA3AF;margin-bottom:4px;padding:0 4px;
    }

    .msg-bubble{
      padding:12px 16px;border-radius:18px;
      font-size:15px;line-height:1.5;
      word-break:break-word;font-weight:500;
    }

    .message.mine .msg-bubble{
      background:linear-gradient(135deg,#6C63FF,#8B5CF6);
      color:white;border-bottom-right-radius:4px;
      box-shadow:0 4px 16px rgba(108,99,255,0.3);
    }

    .message.other .msg-bubble{
      background:white;color:#1A1D2E;
      border-bottom-left-radius:4px;
      box-shadow:0 4px 16px rgba(0,0,0,0.06);
    }

    .msg-img{
      max-width:220px;border-radius:16px;
      cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.1);
      transition:transform 0.2s;
    }
    .msg-img:hover{transform:scale(1.02)}

    .msg-time{
      font-size:10px;color:#9CA3AF;
      margin-top:4px;padding:0 4px;font-weight:600;
    }

    /* INPUT */
    .input-area{
      background:white;
      padding:12px 16px;
      border-top:1px solid rgba(108,99,255,0.08);
      display:flex;align-items:flex-end;gap:10px;
      flex-shrink:0;
      box-shadow:0 -4px 20px rgba(108,99,255,0.06);
    }

    .img-btn{
      width:46px;height:46px;border-radius:14px;
      background:#F5F5FF;border:2px solid #EEF0FF;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;cursor:pointer;flex-shrink:0;
      transition:all 0.2s;
    }
    .img-btn:hover{border-color:#6C63FF;background:#EEF0FF}

    .msg-input{
      flex:1;padding:13px 16px;
      border:2px solid #EEF0FF;border-radius:14px;
      font-size:15px;outline:none;resize:none;
      max-height:120px;font-family:'Inter',sans-serif;
      font-weight:500;color:#1A1D2E;
      transition:all 0.2s;background:#FAFAFF;
    }
    .msg-input:focus{border-color:#6C63FF;background:white}
    .msg-input::placeholder{color:#C4C9D4;font-weight:400}

    .send-btn{
      width:46px;height:46px;border-radius:14px;
      background:linear-gradient(135deg,#6C63FF,#8B5CF6);
      border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      box-shadow:0 4px 16px rgba(108,99,255,0.4);
      transition:all 0.2s;
    }
    .send-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(108,99,255,0.5)}
    .send-btn svg{width:22px;height:22px;fill:white}

    .empty-state{
      text-align:center;padding:60px 20px;
      color:#9CA3AF;
    }
    .empty-icon{font-size:56px;margin-bottom:16px}
    .empty-state p{font-size:15px;font-weight:600}

    .toast{
      position:fixed;bottom:90px;left:50%;
      transform:translateX(-50%) translateY(20px);
      padding:14px 24px;border-radius:14px;
      font-size:14px;font-weight:600;color:white;
      opacity:0;transition:all 0.3s ease;z-index:999;
      white-space:nowrap;font-family:'Inter',sans-serif;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.success{background:linear-gradient(135deg,#10B981,#059669)}
    .toast.error{background:linear-gradient(135deg,#EF4444,#DC2626)}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="chat-header">
  <a href="/pages/chats.html" class="back-btn">←</a>
  <div class="header-avatar" id="otherAvatar">?</div>
  <div class="header-info">
    <h3 id="otherName">Юкшавӣ...</h3>
    <p id="orderCat">...</p>
  </div>
  <div class="online-dot"></div>
</div>

<!-- ПАЁМҲО -->
<div class="messages-area" id="messagesArea">
  <div class="empty-state">
    <div class="empty-icon">💬</div>
    <p>Паёмҳо юкшавӣ...</p>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <button class="img-btn" onclick="document.getElementById('imgInput').click()">📷</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)"/>
  <textarea class="msg-input" id="msgInput" placeholder="Паём нависед..." rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/js/api.js"></script>
<script>
  if(!isLoggedIn()) window.location.href='/';
  const user=getUser();

  const params=new URLSearchParams(window.location.search);
  const orderId=params.get('orderId');
  const otherUserId=params.get('userId');
  if(!orderId||!otherUserId) window.location.href='/pages/chats.html';

  const showMsg=(msg,type)=>{
    const t=document.getElementById('toast');
    t.textContent=msg;t.className=`toast ${type} show`;
    setTimeout(()=>t.classList.remove('show'),3000);
  }

  // Socket.io — Render URL
  const socket=io('https://koryob-app-13th.onrender.com');
  socket.emit('joinRoom',orderId);

  socket.on('receiveMessage',(data)=>{
    if(data.sender._id!==user.id){
      appendMessage(data,false);
      scrollBottom();
    }
  });

  const loadMessages=async()=>{
    try{
      const msgs=await API.getMessages(orderId);
      const area=document.getElementById('messagesArea');
      area.innerHTML='';

      if(msgs.length===0){
        area.innerHTML=`
          <div class="empty-state">
            <div class="empty-icon">💬</div>
            <p>Чатро шумо оғоз кунед!</p>
          </div>`;
      }else{
        msgs.forEach(msg=>appendMessage(msg,msg.sender._id===user.id));
        const other=msgs[0].sender._id===user.id?msgs[0].receiver:msgs[0].sender;
        document.getElementById('otherName').textContent=other.name;
        document.getElementById('otherAvatar').textContent=other.name.charAt(0);
      }
      scrollBottom();
    }catch(err){showMsg(err.message,'error')}
  }

  const appendMessage=(msg,isMine)=>{
    const area=document.getElementById('messagesArea');
    const empty=area.querySelector('.empty-state');
    if(empty) empty.remove();

    const time=new Date(msg.createdAt).toLocaleTimeString('tg-TJ',{
      hour:'2-digit',minute:'2-digit'
    });

    const div=document.createElement('div');
    div.className=`message ${isMine?'mine':'other'}`;

    let content='';
    if(msg.image){
      content=`<img src="${msg.image}" class="msg-img" onclick="window.open('${msg.image}')"/>`;
    }else{
      content=`<div class="msg-bubble">${msg.text}</div>`;
    }

    div.innerHTML=`
      ${!isMine?`<div class="msg-sender">${msg.sender.name}</div>`:''}
      ${content}
      <div class="msg-time">${time}</div>`;

    area.appendChild(div);
  }

  const scrollBottom=()=>{
    const area=document.getElementById('messagesArea');
    area.scrollTop=area.scrollHeight;
  }

  const sendMsg=async()=>{
    const text=document.getElementById('msgInput').value.trim();
    if(!text) return;
    document.getElementById('msgInput').value='';
    autoResize(document.getElementById('msgInput'));

    const formData=new FormData();
    formData.append('orderId',orderId);
    formData.append('receiverId',otherUserId);
    formData.append('text',text);

    try{
      const res=await API.sendMessage(formData);
      appendMessage(res.data,true);
      scrollBottom();
      socket.emit('sendMessage',{
        ...res.data,orderId,
        sender:{_id:user.id,name:user.name}
      });
    }catch(err){showMsg(err.message,'error')}
  }

  const sendImage=async(input)=>{
    if(!input.files[0]) return;
    const formData=new FormData();
    formData.append('orderId',orderId);
    formData.append('receiverId',otherUserId);
    formData.append('image',input.files[0]);
    try{
      showMsg('Сурат фиристода мешавад...','');
      const res=await API.sendMessage(formData);
      appendMessage(res.data,true);
      scrollBottom();
      socket.emit('sendMessage',{
        ...res.data,orderId,
        sender:{_id:user.id,name:user.name}
      });
    }catch(err){showMsg(err.message,'error')}
  }

  const handleKey=(e)=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}
  }

  const autoResize=(el)=>{
    el.style.height='auto';
    el.style.height=Math.min(el.scrollHeight,120)+'px';
  }

  loadMessages();
</script>
</body>
</html>

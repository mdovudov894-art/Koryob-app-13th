<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фармоишҳоям — Корбор</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      color: var(--text-light);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .order-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: var(--transition);
    }

    .order-card:hover {
      transform: translateY(-2px);
    }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .order-category {
      font-size: 16px;
      font-weight: 700;
    }

    .order-desc {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .order-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .order-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-light);
    }

    .responses-count {
      background: #EFF6FF;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .fab {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      z-index: 50;
    }

    .fab:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <a href="/pages/customer-dashboard.html"
    style="text-decoration:none; color:var(--text);">←</a>
  <h1>Фармоишҳоям</h1>
</div>

<div class="page-content">

  <!-- ФИЛТР ТАБҲО -->
  <div class="filter-tabs">
    <button class="tab-btn active" onclick="filterOrders('all', this)">
      Ҳама
    </button>
    <button class="tab-btn" onclick="filterOrders('Актив', this)">
      🟢 Актив
    </button>
    <button class="tab-btn" onclick="filterOrders('Иҷрошуда', this)">
      ✅ Иҷрошуда
    </button>
    <button class="tab-btn" onclick="filterOrders('Пӯшида', this)">
      🔴 Пӯшида
    </button>
  </div>

  <!-- РӮЙХАТИ ФАРМОИШҲО -->
  <div id="ordersList">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div>

<!-- ТУГМАЧАИ ФАРМОИШ ДОДАН -->
<a href="/pages/create-order.html" class="fab">+</a>

<!-- НАВБАРИ ПОЁН -->
<nav class="bottom-nav">
  <a href="/pages/customer-dashboard.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    Асосӣ
  </a>
  <a href="/pages/workers.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    Устоҳо
  </a>
  <a href="/pages/my-orders.html" class="active">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
    </svg>
    Фармоишҳо
  </a>
  <a href="/pages/chats.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    Чатҳо
  </a>
</nav>

<script src="/js/api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/';
  const user = getUser();
  if (user.role !== 'customer') window.location.href = '/pages/worker-dashboard.html';

  let allOrders = [];

  const loadOrders = async () => {
    try {
      allOrders = await API.getMyOrders();
      renderOrders(allOrders);
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const renderOrders = (orders) => {
    const list = document.getElementById('ordersList');

    if (orders.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          </svg>
          <h3>Фармоишҳо нест</h3>
          <p>Аввалин фармоишатонро гузоред!</p>
        </div>`;
      return;
    }

    list.innerHTML = orders.map(order => `
      <div class="order-card fade-in"
        onclick="location.href='/pages/order-detail.html?id=${order._id}'">
        <div class="order-top">
          <span class="order-category">${order.category}</span>
          <span class="badge ${order.status === 'Актив' ? 'badge-success' :
            order.status === 'Иҷрошуда' ? 'badge-primary' : 'badge-danger'}">
            ${order.status}
          </span>
        </div>
        <p class="order-desc">${order.description}</p>
        <div class="order-footer">
          <div class="order-meta">
            <span>📍 ${order.address}</span>
            <span>⏰ ${order.deadline}</span>
          </div>
          <span class="responses-count">
            💬 ${order.responses.length} отклик
          </span>
        </div>
      </div>
    `).join('');
  };

  const filterOrders = (status, btn) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (status === 'all') {
      renderOrders(allOrders);
    } else {
      renderOrders(allOrders.filter(o => o.status === status));
    }
  };

  loadOrders();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отзывҳоям — Корбор</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .rating-hero {
      background: linear-gradient(135deg, #064E3B, #059669);
      padding: 32px 20px;
      color: white;
      text-align: center;
    }

    .rating-big {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }

    .rating-stars {
      font-size: 28px;
      color: #FCD34D;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .rating-count {
      font-size: 14px;
      opacity: 0.85;
    }

    .review-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .review-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .review-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .review-meta {
      flex: 1;
    }

    .review-name {
      font-size: 15px;
      font-weight: 700;
    }

    .review-date {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .review-stars {
      color: #F59E0B;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .review-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .review-photo {
      width: 100%;
      border-radius: 12px;
      max-height: 220px;
      object-fit: cover;
    }

    .stars-breakdown {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .stars-breakdown h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .star-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .star-label {
      font-size: 13px;
      color: var(--text-light);
      width: 24px;
    }

    .star-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .star-bar-fill {
      height: 100%;
      background: #F59E0B;
      border-radius: 4px;
      transition: width 0.8s ease;
    }

    .star-count {
      font-size: 12px;
      color: var(--text-light);
      width: 20px;
      text-align: right;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <a href="/pages/worker-dashboard.html"
    style="text-decoration:none;color:var(--text);">←</a>
  <h1>Отзывҳоям</h1>
</div>

<!-- РЕЙТИНГ ГЕРОЙ -->
<div class="rating-hero" id="ratingHero">
  <div class="rating-big" id="ratingBig">0.0</div>
  <div class="rating-stars" id="ratingStars">☆☆☆☆☆</div>
  <div class="rating-count" id="ratingCount">0 отзыв</div>
</div>

<div class="page-content">

  <!-- ТАҚСИМОТИ СИТОРАҲО -->
  <div class="stars-breakdown">
    <h3>Тақсимоти баҳоҳо</h3>
    <div id="starsBreakdown">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ОТЗЫВҲО -->
  <div id="reviewsList">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div>

<!-- НАВБАРИ ПОЁН -->
<nav class="bottom-nav">
  <a href="/pages/worker-dashboard.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    Асосӣ
  </a>
  <a href="/pages/available-orders.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
    </svg>
    Эълонҳо
  </a>
  <a href="/pages/worker-profile.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    Профил
  </a>
  <a href="/pages/chats.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    Чатҳо
  </a>
</nav>

<script src="/js/api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/';
  const user = getUser();
  if (user.role !== 'worker') window.location.href = '/pages/customer-dashboard.html';

  const loadReviews = async () => {
    try {
      const reviews = await API.getWorkerReviews(user.id);

      // Рейтинг
      const total = reviews.length;
      const avg = total > 0
        ? reviews.reduce((s, r) => s + r.stars, 0) / total
        : 0;

      document.getElementById('ratingBig').textContent = avg.toFixed(1);
      document.getElementById('ratingCount').textContent = `${total} отзыв`;

      const fullStars = Math.round(avg);
      document.getElementById('ratingStars').textContent =
        '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);

      // Тақсимот
      const breakdown = document.getElementById('starsBreakdown');
      const counts = [5, 4, 3, 2, 1].map(s => ({
        star: s,
        count: reviews.filter(r => r.stars === s).length
      }));

      breakdown.innerHTML = counts.map(c => `
        <div class="star-row">
          <span class="star-label">⭐${c.star}</span>
          <div class="star-bar">
            <div class="star-bar-fill"
              style="width:${total > 0 ? (c.count / total * 100) : 0}%">
            </div>
          </div>
          <span class="star-count">${c.count}</span>
        </div>
      `).join('');

      // Отзывҳо
      const list = document.getElementById('reviewsList');

      if (reviews.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0
                00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0
                00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538
                1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838
                -.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c
                -.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
            </svg>
            <h3>Отзывҳо нест</h3>
            <p>Корро иҷро кунед ва отзыв гиред!</p>
          </div>`;
        return;
      }

      list.innerHTML = reviews.map(r => `
        <div class="review-card fade-in">
          <div class="review-top">
            <div class="review-avatar">
              ${r.customer.avatar
                ? `<img src="${r.customer.avatar}"
                   style="width:44px;height:44px;border-radius:50%;object-fit:cover;" />`
                : r.customer.name.charAt(0)}
            </div>
            <div class="review-meta">
              <div class="review-name">${r.customer.name}</div>
              <div class="review-date">${formatDate(r.createdAt)}</div>
            </div>
            <div class="review-stars">
              ${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}
            </div>
          </div>
          ${r.comment
            ? `<p class="review-text">${r.comment}</p>` : ''}
          ${r.photo
            ? `<img src="${r.photo}" class="review-photo" />` : ''}
        </div>
      `).join('');

    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  loadReviews();
</script>

</body>
</html>

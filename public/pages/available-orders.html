<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эълонҳо — Корбор</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .search-bar {
      padding: 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 57px;
      z-index: 40;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-size: 15px;
      outline: none;
      transition: var(--transition);
      background: var(--bg);
    }

    .search-input:focus { border-color: var(--primary); }

    .filters {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      color: var(--text-light);
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .order-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: var(--transition);
    }

    .order-card:hover { transform: translateY(-2px); }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .order-category {
      font-size: 16px;
      font-weight: 700;
    }

    .order-budget {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .order-desc {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .order-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .order-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-light);
    }

    .responses-count {
      background: #EFF6FF;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .customer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .customer-mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .customer-name {
      font-size: 13px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <a href="/pages/worker-dashboard.html"
    style="text-decoration:none;color:var(--text);">←</a>
  <h1>Эълонҳои актив</h1>
</div>

<!-- ҶУСТУҶӮ -->
<div class="search-bar">
  <input class="search-input" id="searchInput"
    placeholder="🔍 Категория ё суроға..."
    oninput="applyFilters()" />
</div>

<!-- КАТЕГОРИЯҲО -->
<div class="filters">
  <div class="filter-chip active" onclick="filterCat('', this)">Ҳама</div>
  <div class="filter-chip" onclick="filterCat('Кафел', this)">🟦 Кафел</div>
  <div class="filter-chip" onclick="filterCat('Шкатур', this)">🪚 Шкатур</div>
  <div class="filter-chip" onclick="filterCat('Сантехника', this)">🚿 Сантехника</div>
  <div class="filter-chip" onclick="filterCat('Барқ', this)">⚡ Барқ</div>
  <div class="filter-chip" onclick="filterCat('Гаҷкорӣ', this)">🏗️ Гаҷкорӣ</div>
  <div class="filter-chip" onclick="filterCat('Рангкорӣ', this)">🎨 Рангкорӣ</div>
  <div class="filter-chip" onclick="filterCat('Стяжка', this)">🧱 Стяжка</div>
  <div class="filter-chip" onclick="filterCat('Дигар', this)">🔧 Дигар</div>
</div>

<!-- РӮЙХАТ -->
<div class="page-content" id="ordersList">
  <div class="loading"><div class="spinner"></div></div>
</div>

<!-- НАВБАРИ ПОЁН -->
<nav class="bottom-nav">
  <a href="/pages/worker-dashboard.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    Асосӣ
  </a>
  <a href="/pages/available-orders.html" class="active">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
    </svg>
    Эълонҳо
  </a>
  <a href="/pages/worker-profile.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    Профил
  </a>
  <a href="/pages/chats.html">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    Чатҳо
  </a>
</nav>

<script src="/js/api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/';
  const user = getUser();
  if (user.role !== 'worker') window.location.href = '/pages/customer-dashboard.html';

  let allOrders = [];
  let currentCat = '';

  const loadOrders = async () => {
    try {
      allOrders = await API.getAllOrders();
      renderOrders(allOrders);
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const renderOrders = (orders) => {
    const list = document.getElementById('ordersList');

    if (orders.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          </svg>
          <h3>Эълонҳо нест</h3>
          <p>Ҳоло эълонҳо мавҷуд нест</p>
        </div>`;
      return;
    }

    list.innerHTML = orders.map(order => `
      <div class="order-card fade-in"
        onclick="location.href='/pages/order-detail.html?id=${order._id}'">
        <div class="order-top">
          <span class="order-category">${order.category}</span>
          <span class="order-budget">💰 ${order.budget}</span>
        </div>
        <div class="customer-row">
          <div class="customer-mini-avatar">
            ${order.customer.name.charAt(0)}
          </div>
          <span class="customer-name">
            ${order.customer.name} · 📍 ${order.customer.region}
          </span>
        </div>
        <p class="order-desc">${order.description}</p>
        <div class="order-footer">
          <div class="order-meta">
            <span>📍 ${order.address}</span>
            <span>⏰ ${order.deadline}</span>
          </div>
          <span class="responses-count">
            💬 ${order.responses.length}
          </span>
        </div>
      </div>
    `).join('');
  };

  const filterCat = (cat, el) => {
    currentCat = cat;
    document.querySelectorAll('.filter-chip')
      .forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    applyFilters();
  };

  const applyFilters = () => {
    const search = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allOrders;

    if (currentCat) {
      filtered = filtered.filter(o => o.category === currentCat);
    }

    if (search) {
      filtered = filtered.filter(o =>
        o.category.toLowerCase().includes(search) ||
        o.address.toLowerCase().includes(search) ||
        o.description.toLowerCase().includes(search));
    }

    renderOrders(filtered);
  };

  loadOrders();
</script>

</body>
</html>

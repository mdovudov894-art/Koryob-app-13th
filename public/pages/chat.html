<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат — Корбор</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .chat-header {
      background: var(--card);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      overflow: hidden;
    }

    .chat-header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-header-info h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .chat-header-info p {
      font-size: 12px;
      color: var(--text-light);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.mine .message-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other .message-bubble {
      background: var(--card);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    .message-img {
      max-width: 200px;
      border-radius: 14px;
      cursor: pointer;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      padding: 0 4px;
    }

    .message-sender {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .chat-input-area {
      background: var(--card);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 24px;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
      font-family: inherit;
      transition: var(--transition);
      background: var(--bg);
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .send-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .send-btn svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .img-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .img-btn:hover {
      border-color: var(--primary);
    }

    .date-divider {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      background: var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      align-self: center;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 18px;
      width: fit-content;
      box-shadow: var(--shadow);
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-light);
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="chat-header">
  <a href="/pages/chats.html"
    style="text-decoration:none;color:var(--text);font-size:20px;">←</a>
  <div class="chat-header-avatar" id="otherAvatar">?</div>
  <div class="chat-header-info">
    <h3 id="otherName">Пайвастшави...</h3>
    <p id="orderCategory">...</p>
  </div>
</div>

<!-- ПАЁМҲО -->
<div class="messages-area" id="messagesArea"></div>

<!-- ВОРИДКУНИИ ПАЁМ -->
<div class="chat-input-area">
  <button class="img-btn" onclick="document.getElementById('imgInput').click()">
    📷
  </button>
  <input type="file" id="imgInput" accept="image/*"
    style="display:none" onchange="sendImage(this)" />
  <textarea class="chat-input" id="msgInput" placeholder="Паём нависед..."
    rows="1" onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/js/api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/';
  const user = getUser();

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');
  const otherUserId = params.get('userId');

  if (!orderId || !otherUserId) window.location.href = '/pages/chats.html';

  // Socket.io пайваст
  const socket = io('http://localhost:5000');
  socket.emit('joinRoom', orderId);

  socket.on('receiveMessage', (data) => {
    if (data.sender._id !== user.id) {
      appendMessage(data, false);
      scrollBottom();
    }
  });

  const loadMessages = async () => {
    try {
      const msgs = await API.getMessages(orderId);
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';

      if (msgs.length === 0) {
        area.innerHTML = `
          <div class="empty-state">
            <p>Чатро шумо оғоз кунед!</p>
          </div>`;
      } else {
        msgs.forEach(msg => appendMessage(msg, msg.sender._id === user.id));
      }

      // Номи дигар корбарро нишон додан
      if (msgs.length > 0) {
        const other = msgs[0].sender._id === user.id
          ? msgs[0].receiver
          : msgs[0].sender;
        document.getElementById('otherName').textContent = other.name;
        document.getElementById('otherAvatar').textContent =
          other.name.charAt(0);
      }

      scrollBottom();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const appendMessage = (msg, isMine) => {
    const area = document.getElementById('messagesArea');
    const emptyState = area.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const div = document.createElement('div');
    div.className = `message ${isMine ? 'mine' : 'other'} fade-in`;

    const time = new Date(msg.createdAt).toLocaleTimeString('tg-TJ', {
      hour: '2-digit',
      minute: '2-digit'
    });

    let content = '';
    if (msg.image) {
      content = `<img src="${msg.image}" class="message-img"
        onclick="window.open('${msg.image}')" />`;
    } else {
      content = `<div class="message-bubble">${msg.text}</div>`;
    }

    div.innerHTML = `
      ${!isMine ? `<div class="message-sender">${msg.sender.name}</div>` : ''}
      ${content}
      <div class="message-time">${time}</div>`;

    area.appendChild(div);
  };

  const scrollBottom = () => {
    const area = document.getElementById('messagesArea');
    area.scrollTop = area.scrollHeight;
  };

  const sendMsg = async () => {
    const text = document.getElementById('msgInput').value.trim();
    if (!text) return;

    document.getElementById('msgInput').value = '';

    const formData = new FormData();
    formData.append('orderId', orderId);
    formData.append('receiverId', otherUserId);
    formData.append('text', text);

    try {
      const res = await API.sendMessage(formData);
      appendMessage(res.data, true);
      scrollBottom();

      socket.emit('sendMessage', {
        ...res.data,
        orderId,
        sender: { _id: user.id, name: user.name }
      });
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const sendImage = async (input) => {
    if (!input.files[0]) return;

    const formData = new FormData();
    formData.append('orderId', orderId);
    formData.append('receiverId', otherUserId);
    formData.append('image', input.files[0]);

    try {
      showToast('Сурат фиристода мешавад...', '');
      const res = await API.sendMessage(formData);
      appendMessage(res.data, true);
      scrollBottom();

      socket.emit('sendMessage', {
        ...res.data,
        orderId,
        sender: { _id: user.id, name: user.name }
      });
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  };

  loadMessages();
</script>

</body>
</html>
